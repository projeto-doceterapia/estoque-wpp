<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque - Painel Completo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="dashboard-container">
    
    <header class="main-header">
        <div class="header-titles">
            <h1 class="page-title">Estoque</h1>
            <p class="page-subtitle">Controle seus insumos e acompanhe alertas de baixo nível</p>
        </div>
        <button onclick="abrirModalCadastro()" class="btn btn-salmon">
            <i class="fa-solid fa-plus"></i> Novo Insumo
        </button>
    </header>

    <section class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-header">
                <span class="kpi-icon icon-purple"><i class="fa-solid fa-box-open"></i></span>
                Total de insumos
            </div>
            <span id="kpiTotal" class="kpi-value value-purple">0</span>
        </div>
        <div class="kpi-card border-normal">
            <div class="kpi-header">
                <span class="kpi-icon icon-emerald"><i class="fa-regular fa-circle-check"></i></span>
                Em nível normal
            </div>
            <span id="kpiNormal" class="kpi-value value-emerald">0</span>
        </div>
        <div class="kpi-card border-baixo">
            <div class="kpi-header">
                <span class="kpi-icon icon-amber"><i class="fa-solid fa-triangle-exclamation"></i></span>
                Nível baixo
            </div>
            <span id="kpiBaixo" class="kpi-value value-amber">0</span>
        </div>
        <div class="kpi-card border-critico">
            <div class="kpi-header">
                <span class="kpi-icon icon-red"><i class="fa-solid fa-chart-line-down"></i></span>
                Crítico
            </div>
            <span id="kpiCritico" class="kpi-value value-red">0</span>
        </div>
    </section>

    <section class="filter-card">
        <div class="filter-controls">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Buscar insumo..." class="search-input">
            </div>
            
            <div class="tab-group">
                <button onclick="filtrarPorStatus('todos')" id="btnTab-todos" class="tab-btn tab-active">Todos</button>
                <button onclick="filtrarPorStatus('normal')" id="btnTab-normal" class="tab-btn">Normal</button>
                <button onclick="filtrarPorStatus('baixo')" id="btnTab-baixo" class="tab-btn">Baixo</button>
                <button onclick="filtrarPorStatus('critico')" id="btnTab-critico" class="tab-btn">Crítico</button>
            </div>
        </div>
    </section>

    <section class="table-container">
        <div class="table-responsive">
            <table class="products-table">
                <thead>
                    <tr>
                        <th>Insumo</th>
                        <th>Quantidade</th>
                        <th>Mínimo</th>
                        <th>Nível</th>
                        <th>Status</th>
                        <th class="text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </section>
</div>

<div id="insumoModal" class="modal-overlay hidden">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle">Novo Insumo</h3>
            <button onclick="fecharModal()" class="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <form id="insumoForm" onsubmit="salvarInsumo(event)" class="modal-form">
            <input type="hidden" id="insumoId">
            
            <div class="form-group">
                <label>Nome do Insumo</label>
                <input type="text" id="formNome" required class="form-input">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Quantidade Atual</label>
                    <input type="number" step="0.01" id="formQuantidade" required class="form-input">
                </div>
                <div class="form-group">
                    <label>Unidade de Medida</label>
                    <select id="formUnidade" class="form-input">
                        <option value="unidades">Unidades</option>
                        <option value="g">Gramas (g)</option>
                        <option value="ml">Mililitros (ml)</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Estoque Mínimo</label>
                    <input type="number" step="0.01" id="formMinimo" required class="form-input">
                </div>
                <div class="form-group">
                    <label>Estoque Máximo</label>
                    <input type="number" step="0.01" id="formMaximo" required class="form-input">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Preço Unitário (R$)</label>
                    <input type="number" step="0.01" id="formPreco" required class="form-input">
                </div>
                <div class="form-group">
                    <label>Data da Compra</label>
                    <input type="date" id="formData" required class="form-input">
                </div>
            </div>

            <div class="form-actions">
                <button type="button" onclick="fecharModal()" class="btn btn-cancel">Cancelar</button>
                <button type="submit" class="btn btn-salmon">Salvar Registro</button>
            </div>
        </form>
    </div>
</div>

<script src="/js/script.js"></script>
</body>
</html>
